name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPLOAD_PASSWORD: ${{ secrets.UPLOAD_PASSWORD }}
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          if [ -f DokanKhata.zip ]; then unzip -o -q DokanKhata.zip; fi
          if [ -f google-services.json ]; then cp google-services.json app/google-services.json; fi
          ls

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build
        run: bash ci/build.sh

      - name: Publish for download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dokan Khata – build ${{ github.run_number }}
          files: |
            DokanKhata.apk
            DokanKhata.aab
